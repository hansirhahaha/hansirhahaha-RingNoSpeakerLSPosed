plugins {
    id "com.android.application"
}

android {
    namespace "com.hansir.ringnospeaker"
    compileSdk 35

    defaultConfig {
        applicationId "com.hansir.ringnospeaker"
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    compileOnly "de.robv.android.xposed:api:82"
}
